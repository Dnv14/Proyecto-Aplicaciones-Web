<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Shop - Registro</title>
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-logo">
                <img th:src="@{/imgs/logo.jpg}" alt="Sport Shop Logo">
            </div>

            <h2 class="auth-title">Registro</h2>
            <p th:if="${param.errorCorreo}">Los correos no coinciden</p>
            <p th:if="${param.errorContrasenia}">Las contraseñas no coinciden</p>
            <p th:if="${param.errorCorreoExistente}">El correo ya fue registrado</p>

            <form class="auth-form" th:action="@{/registro}" method="post">

                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Value" required
                        minlength="3">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Eletronico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Value" required>
                </div>

                <div class="form-group">
                    <label for="confirmarCorreo">Confirmar Correo:</label>
                    <input type="email" id="confirmarCorreo" name="confirmarCorreo" placeholder="Value" required>
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="Value" required>
                </div>

                <div class="form-group">
                    <label for="confirmarContrasenia">Confirmar Contraseña:</label>
                    <input type="password" id="confirmarContrasenia" name="confirmarContrasenia" placeholder="Value"
                        required>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>

            </form>
        </section>
    </main>
</body>

</html>
