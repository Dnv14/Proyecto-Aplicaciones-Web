<!DOCTYPE html>
<html lang="es">
<head th:replace="~{framesAdmin/utileriasAdmin/head :: headAdmin('Sport Shop | Panel Admin')}"></head>
<body>
<header th:replace="~{FramesAdmin/utileriasAdmin/header :: headerAdmin}"></header>
<main class="contenido-principal">

    <h1 class="section-title">Ajustar Inventario</h1>
    <p th:if="${mensaje != null}" th:text="${mensaje}"style="color: #16a34a; font-weight: 600;"></p>
    <p th:if="${error != null}"th:text="${error}"style="color: #dc2626; font-weight: 600;"></p>
    <div class="inventory-card">
        <form th:action="@{/admin/ajustarInventario}" method="get" class="form-group">
            <label for="idProducto">Código del producto</label>
            <div class="row">
                <input type="number" id="idProducto" name="idProducto" min="1" required class="input-rounded" placeholder="Ingrese el ID del producto">
                <button type="submit" class="btn-confirm-adjustments" > Buscar </button>
            </div>
        </form>
        <div th:if="${producto!=null}" class="form-group">
            <h2>Información  del producto</h2>
            <p>
                <strong>Nombre: </strong>
                <span th:text="${producto.nombre}"></span>
            </p>
            <p>
                <strong>Stock actual:</strong>
                <span th:text="${producto.stock}"></span>
            </p>
        </div>
        <form th:if="${producto != null}"  th:action="@{/admin/ajustarInventario}" method="post">
            <input type="hidden"  name="idProducto" th:value="${producto.idProducto}">
        <div class="form-group">
            <label for="tipoMovimiento">Tipo de movimiento</label>
            <select id="tipoMovimiento" name="tipoMovimiento" class="input-rounded" required>
                <option value="">Seleccione un movimiento</option>
                <option value="ENTRADA">Entrada</option>
                <option value="SALIDA">Salida</option>
                <option value="MERMA">Merma</option>
                <option value="CORRECCION">Corrección</option>
            </select>
        </div>
        <div class="form-group">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" min="0" required class="input-rounded" placeholder="Ingrese la cantidad">
        </div>
        <div class="form-group">
            <label for="comentario">Motivo del ajuste</label>
            <textarea id="comentario"  name="comentario" class="input-rounded" rows="3" required placeholder="Escriba el motivo del ajuste"></textarea>
        </div>
            <button type="submit" class="btn-confirm-adjustments">Confirmar ajuste</button>
        </form>
    </div>


</main>

<footer class="main-footer">
    <div class="footer-benefit">
        <span>Envíos gratis</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
</footer>

</body>
</html>
