<!DOCTYPE html>
<html lang="es">
<head th:replace="~{framesAdmin/utileriasAdmin/head :: headAdmin('Sport Shop | Panel Admin')}"></head>
<body>
<header th:replace="~{FramesAdmin/utileriasAdmin/header :: headerAdmin}"></header>

<main class="main-content">
    <h1 class="section-title">Editar Producto</h1>

    <form th:action="@{/admin/productos/{id}/editar(id=${producto.idProducto})}"  method="post" enctype="multipart/form-data" class="create-product-form">
        <div class="form-grid">
            <div class="form-section">
                <div class="form-group row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" th:value="${producto.nombre}" class="input-rounded">
                </div>

                <div class="form-group stacked">
                    <label for="descripcion">Descripcion:</label>
                    <textarea id="descripcion" name="descripcion" th:text="${producto.descripcion}" class="textarea-rounded" rows="4"></textarea>
                </div>

                <div class="form-group row">
                    <label for="precio">Precio: $</label>
                    <input type="text" id="precio" name="precio" th:value="${producto.precio}" class="input-rounded input-short">
                </div>

                <div class="form-group row">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria" class="select-rounded">
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.idCategoria}"
                                th:text="${categoria.nombre}"
                                th:selected="${categoria.idCategoria == producto.categoria.idCategoria}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-section image-upload-card">
                <div class="image-preview-box">
                    <img th:src="@{${producto.imagen}}"
                         alt="Imagen del producto"
                         style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <label for="file-input" class="btn-select-img">Seleccionar Imagen</label>
                <input type="file" id="file-input" accept="image/*" name="imagenArchivo" style="display: none;">
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Guardar Cambios</button>
        </div>
    </form>
</main>

<footer class="main-footer">
    <div class="footer-benefit">
        <span>Envíos gratis</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
</footer>

</body>

</html>>
