<!DOCTYPE html>
<html lang="es">
<head th:replace="~{framesAdmin/utileriasAdmin/head :: headAdmin('Sport Shop | Panel Admin')}"></head>

<body>
<header th:replace="~{FramesAdmin/utileriasAdmin/header :: headerAdmin}"></header>

<main class="main-content">
    <h1 class="section-title">Gestión de Productos</h1>

    <div class="inventory-card">
        <div class="products-toolbar">
            <input type="text" class="input-rounded product-search" placeholder="Ingresa el nombre o el codigo del producto">
            <a th:href="@{/admin/crearProducto}" class="btn-confirm-adjustments">Crear Producto</a>
        </div>

        <div class="table-scroll-container">
            <table class="inventory-table">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.idProducto}"></td>
                        <td>
                            <img th:src="${producto.imagen}" th:alt="${producto.nombre}" class="product-thumbnail">
                        </td>
                        <td th:text="${producto.nombre}"></td>
                        <td th:text="${producto.categoria.nombre}"></td>
                        <td th:text="${producto.precio}"></td>
                        <td th:text="${producto.stock}"></td>
                        <td>
                            <span th:if="${producto.activo == false}" class="status-badge inactive">Inactivo</span>
                            <span th:if="${producto.activo == true and producto.stock == 0}" class="status-badge exhausted">Agotado</span>
                            <span th:if="${producto.activo == true and producto.stock > 0}" class="status-badge active">Activo</span>
                        </td>
                        <td class="action-col">
                            <a th:href="@{/admin/productos/{id}/editar(id=${producto.idProducto})}" class="btn-edit-product">Editar</a>
                            <form th:action="@{/admin/productos/{id}/estado(id=${producto.idProducto})}" method="post">
                                <button type="submit" th:if="${producto.activo == true}" class="btn-deactivate-product">Desactivar</button>
                                <button type="submit" th:if="${producto.activo == false}" class="btn-activate-product">Activar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<footer class="main-footer">
    <div class="footer-benefit">
        <span>Envíos gratis</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
</footer>
</body>
</html>
