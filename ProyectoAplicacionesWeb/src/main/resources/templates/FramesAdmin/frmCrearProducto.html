<!DOCTYPE html>
<html lang="es">
<head th:replace="~{framesAdmin/utileriasAdmin/head :: headAdmin('Sport Shop | Panel Admin')}">
<body>
<header th:replace="~{FramesAdmin/utileriasAdmin/header :: headerAdmin}"></header>

<main class="main-content">
    <h1 class="section-title">Crear Producto</h1>
    <form th:action="@{/admin/crearProducto}" method="post" enctype="multipart/form-data" class="create-product-form">
        <div class="form-grid">
            <div class="form-section">
                <div class="form-group row">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" class="input-rounded" required>
                </div>
                <div class="form-group stacked">
                    <label for="descripcion">Descripcion:</label>
                    <textarea id="descripcion" name="descripcion" class="textarea-rounded" rows="4"
                              maxlength="255"></textarea>
                </div>
                <div class="form-group row">
                    <label for="precio">Precio: $</label>
                    <input type="number" id="precio" name="precio" class="input-rounded input-short" min="0.01"
                           step="0.01" required>
                </div>
                <div class="form-group row">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria.idCategoria" class="select-rounded" required>
                        <option value="" selected disabled>Selecciona una categoría</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.idCategoria}"
                                th:text="${categoria.nombre}">
                        </option>
                    </select>
                </div>
                <div class="form-group row">
                    <label for="stock">Stock Inicial:</label>
                    <input type="number" id="stock" name="stock" class="input-rounded input-short" min="0" step="1"
                           required>
                </div>
            </div>
            <div class="form-section image-upload-card">
                <div class="image-preview-box"></div>
                <label for="file-input" class="btn-select-img">Seleccionar Imagen</label>
                <input type="file" id="file-input" name="imagenArchivo" accept="image/*" style="display: none;">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Crear Producto</button>
        </div>
    </form>
</main>

<footer class="main-footer">
    <div class="footer-benefit">
        <span>Envíos gratis</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
    <div class="footer-benefit">
        <span>Compras seguras</span>
        <small>En compras mayores $500</small>
    </div>
</footer>

</body>

</html>
