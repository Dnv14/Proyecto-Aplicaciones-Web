<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <header th:fragment="headerAdmin" class="main-header">
            <div class="header-top">
                <a th:href="@{/admin}" class="logo">
                    <img th:src="@{/imgs/logo.jpg}" alt="Sport Shop Logo">
                </a>

                <div class="search">
                    <input type="text" placeholder="¿Qué producto estás buscando?">
                </div>

                <div class="links-usuario">
                    <div class="menu-dropdown">
                        <a href="#" class="btn-dropdown">Panel Administrativo </a>
                        <ul class="dropdown-content">
                            <li><a th:href="@{/admin/productos}">Gestionar Productos</a></li>
                            <li><a th:href="@{/admin/inventario}">Ajustar Inventario</a></li>
                            <li><a th:href="@{/admin/ordenes}">Ver Listado de Órdenes</a></li>
                            <li><a th:href="@{/admin/ordenes/estado}">Cambiar Estado de una Orden</a></li>
                            <li><a th:href="@{/admin/dashboard}">Ver Dashboard de Resumen</a></li>
                            <li><a th:href="@{/admin/categorias}">Gestionar Categorías</a></li>
                        </ul>
                    </div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">Cerrar sesión</button>
                    </form>
                </div>
            </div>

            <nav class="nav-categorias">
                <ul>
                    <li><a href="#">Fútbol</a></li>
                    <li><a href="#">Gym</a></li>
                    <li><a href="#">Basquetbol</a></li>
                    <li><a href="#">Boxeo</a></li>
                    <li><a href="#">Ropa deportiva</a></li>
                    <li><a href="#">Calzado</a></li>
                    <li><a href="#">Accesorios</a></li>
                </ul>
            </nav>
        </header>
    </body>
</html>
