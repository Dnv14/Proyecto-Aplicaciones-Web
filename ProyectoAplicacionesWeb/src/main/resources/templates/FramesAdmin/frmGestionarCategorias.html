<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{FramesAdmin/utileriasAdmin/head :: headAdmin('Sport Shop | Gestionar Categorías')}"></head>

    <body>
        <header th:replace="~{FramesAdmin/utileriasAdmin/header :: headerAdmin}"></header>

        <main class="main-content categorias-container">
            <h1 class="section-title">Gestionar Categorías</h1>

            <div class="inventory-card">
                <div class="products-toolbar cat-toolbar">
                    <form th:action="@{/admin/categorias}" method="get" class="search-form" style="margin: 0;">
                        <input type="text"
                               name="buscar"
                               th:value="${param.buscar}"
                               class="input-rounded product-search"
                               placeholder="Buscar categoría...">
                    </form>
                    <a th:href="@{/admin/crearCategoria}" class="btn-confirm-adjustments">Nueva Categoría +</a>
                </div>

                <div class="table-scroll-container">
                    <table class="inventory-table cat-table">
                        <thead>
                            <tr>
                                <th class="col-cat-id">ID Categoría</th>
                                <th class="col-cat-nombre">Categoría</th>
                                <th class="col-cat-cant">Productos</th>
                                <th class="col-cat-acciones">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoCategorias">

                        <tr th:each="categoria : ${categorias}" class="fila-categoria">
                            <td class="col-cat-id" th:text="${categoria.idCategoria}"></td>
                            <td class="col-cat-nombre" th:text="${categoria.nombre}"></td>
                            <td class="col-cat-cant"
                                th:text="${categoria.productos != null ? #lists.size(categoria.productos) : 0}"></td>

                            <td class="col-cat-acciones action-col cat-action-col">
                                <a th:href="@{/admin/editarCategoria/{id}(id=${categoria.idCategoria})}"
                                   class="btn-edit-product">Editar</a>

                                <form th:action="@{/admin/eliminarCategoria/{id}(id=${categoria.idCategoria})}"
                                      method="post"
                                      class="cat-form-eliminar"
                                      onsubmit="return confirm('¿Deseas eliminar esta categoría?');">
                                    <button type="submit" class="btn-deactivate-product">Eliminar</button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="4" class="cat-tabla-vacia"
                                style="text-align: center; padding: 25px; color: #666;">
                                No hay categorías registradas o no se encontraron resultados.
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="footer-benefit">
                <span>Envíos gratis</span>
                <small>En compras mayores $500</small>
            </div>
            <div class="footer-benefit">
                <span>Compras seguras</span>
                <small>En compras mayores $500</small>
            </div>
            <div class="footer-benefit">
                <span>Compras seguras</span>
                <small>En compras mayores $500</small>
            </div>
        </footer>
    </body>
</html>
