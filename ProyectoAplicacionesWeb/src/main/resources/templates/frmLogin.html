<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Shop - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>

<body>

    <header class="auth-header">
        <div class="logo">
            <img src="../imgs/logo.jpg" alt="Sport Shop Logo">
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-logo">
            <img src="../imgs/logo.jpg" alt="Sport Shop Logo">
        </div>

        <h2 class="auth-title">Iniciar Sesión o Registrate</h2>

        <section class="auth-card">
            <form class="auth-form" action="/login" method="post">

                <div class="form-group">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" placeholder="Value" required>
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="Value" required>
                </div>

                <button type="submit" class="btn-primary">Iniciar sesión</button>

                <div class="auth-links">
                    <a href="frmRegistro.html" class="link-register">¿No tienes cuenta? Da click aquí!</a>
                </div>

            </form>

        </section>
    </main>

</body>

</html>
