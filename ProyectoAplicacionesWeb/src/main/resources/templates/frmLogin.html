<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Shop - Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-logo">
                <img th:src="@{/imgs/logo.jpg}" alt="Sport Shop Logo">
            </div>

            <h2 class="auth-title">Iniciar Sesión o Registrate</h2>

            <form class="auth-form" th:action="@{/login}" method="post">
                <p th:if="${param.error}">Correo o contraseña incorrectos</p>
                <p th:if="${param.registrado}">Cuenta registrada exitosamente</p>
                <div class="form-group">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" placeholder="Value" required>
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="Value" required>
                </div>

                <button type="submit" class="btn-primary">Iniciar sesión</button>

                <div class="auth-links">
                    <a th:href="@{/registro}" class="link-register">¿No tienes cuenta? Da click aquí!</a>
                </div>
            </form>

        </section>
    </main>

</body>

</html>
